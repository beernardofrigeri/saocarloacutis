<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Projeto Final</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/logo_referencia.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <article>
        <header>
            <div id="logo">
                <img src="../img/saocarloslogo.png" alt="Logo" width="150" height="75">
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html" class="menu-alt">Início</a></li>
                    <li><a href="../html/teclados.html" class="menu-alt">Teclados</a></li>
                    <li><a href="../html/mouses.html" class="menu-alt">Mouses</a></li>
                    <li><a href="../html/fones.html" class="menu-alt">Fones de Ouvido</a></li>
                    <li><a href="../html/contato.html" class="menu-alt">Contato e Localização</a></li>
                    <li><a href="../html/carrinho.html" id="carrinho-conf"><img src="../img/seguro.png" alt="Carrinho de Compras" width="25" height="25"></a></li>
                </ul>
            </nav>
        </header>
        <main>
            <h1>Seu Carrinho:</h1>
            <div class="cart-layout">
                <section class="cart-products caixa_principal_contato">
                    <h3>Seus Produtos:</h3>
                    <div id="cart-items"></div>
                </section>
                <aside class="cart-summary" aria-label="Resumo da compra">
                    <h3>Resumo da compra</h3>
                    <form id="coupon-form" class="coupon-form">
                        <label for="coupon-code">Cupom de desconto</label>
                        <div class="coupon-controls">
                            <input id="coupon-code" type="text" placeholder="Digite seu cupom" autocomplete="off">
                            <button type="submit">Aplicar</button>
                        </div>
                        <p id="coupon-message" role="status"></p>
                    </form>
                    <div class="summary-line">
                        <span>Subtotal</span>
                        <strong id="cart-subtotal">R$ 0,00</strong>
                    </div>
                    <div class="summary-line discount-line">
                        <span>Desconto</span>
                        <strong id="cart-discount">R$ 0,00</strong>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <strong id="cart-total">R$ 0,00</strong>
                    </div>
                    <button id="checkout-btn">Finalizar Compra</button>
                </aside>
            </div>
    </main>
    <footer>
        <p>&copy; Desenvolvido por Bernardo Girardi Frigeri - Senac 2026</p>
    </footer>
    </article>
<script src="../js/script.js"></script>
</body>
</html>
